# Site navigation: tabs in the top bar, groups in the sidebar, pages by their path in pages/
# without ".md". "adr:*" lists every decision record in docs/adr.
site:
  name: PASR
  tagline: privacy-aware social robot
  blurb: >-
    A personal social robot that says a sensitive reminder out loud only when nobody else can
    hear it, and a research platform to measure how well it does that.
  author: Aroosa Batool
  repo: https://github.com/Aroosa-Batool/privacy-aware-social-robot
  branch: main
  url: https://aroosa-batool.github.io/privacy-aware-social-robot/

# The Master's thesis this project belongs to: shown on pages/thesis.md (::thesis-facts), the
# front page (::thesis-banner) and the footer of every page.
thesis:
  title: >-
    From Consent to Privacy Management: Investigating Users' Perceptions of a Social Robot That
    Remembers Their Privacy Preferences for Sensitive Information Disclosure
  author: Aroosa Batool
  degree: M.Sc. Computer Science
  university: University of Siegen, Germany
  faculty: Faculty IV, School of Science and Technology
  department: Department of Electrical Engineering and Computer Science
  group: Ubiquitous Computing
  supervisors:
    - {name: Univ.-Prof. Dr. Kristof Van Laerhoven, role: First supervisor}
    - {name: Atikkhan Nilgar, role: Second supervisor}
  period: July to December 2026
  logos:
    - src: /assets/logos/uni-siegen.svg
      alt: University of Siegen
      href: https://www.uni-siegen.de/
    - src: /assets/logos/faculty-nt.svg
      alt: School of Science and Technology (Faculty IV), University of Siegen
      href: https://www.uni-siegen.de/nt/elektrotechnik-informatik/department-elektrotechnik-und-informatik
    - src: /assets/logos/ubicomp.svg
      alt: Ubiquitous Computing group, University of Siegen
      href: https://ubicomp.eti.uni-siegen.de/

