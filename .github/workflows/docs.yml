name: Docs

# Builds website/ and publishes it to GitHub Pages
# (https://aroosa-batool.github.io/privacy-aware-social-robot/).
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/adr/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "website/**"
      - "docs/adr/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Build (fails on a broken internal link)
        run: uv run website/build.py --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: website/_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
