name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (everything; CPU-only torch on Linux)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests (stand-in devices; no robot)
        run: uv run pytest

  bangle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Watch app syntax
        run: node --check bangle/consent_app.js
