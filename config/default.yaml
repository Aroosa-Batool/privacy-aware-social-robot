privacy:
  detection_modality: audio_and_camera
  disclosure_policy: always_ask
reminder:
  wake_lead_minutes: 7.0
  listen_window_minutes: 5.0
  default_time: 00:00:00
  min_listen_seconds: 15.0
  listen_until_due: false
  poll_interval_seconds: 10.0
  missed_grace_minutes: 10.0
  scan_if_only_owner_heard: true
consent:
  timeout_seconds: 60.0
  prompt_text: I noticed someone is with you. Should I say your reminder out loud?
identity:
  voice_threshold: 0.35
  face_threshold: 0.4
  min_voice_segment_seconds: 1.0
  min_nonowner_seconds: 3.0
  enroll_face_poses:
  - front
  - left
  - right
  - up
  - down
  enroll_face_samples: 4
  enroll_face_pose_seconds: 15.0
  enroll_voice_seconds: 30.0
  enroll_timeout_seconds: 120.0
  aggregate: max
  voice_aggregate: mean
vad:
  speech_threshold: 0.5
  min_speech_ms: 250
  min_silence_ms: 300
  max_segment_seconds: 10.0
scan:
  positions:
  - right
  - front
  - left
  tilts:
  - level
  - up
  - down
  study_seconds: 10.0
  study_views: 5
  settle_seconds: 0.6
  frames_per_position: 3
  head_speed: 5
  follow:
    enabled: false
    min_face_px: 60
    min_score: 0.7
    edge_margin: 0.03
    max_turned: 0.4
    turn_gain: 2.5
    nod_gain: 1.5
    invert_turn: false
    invert_nod: false
perception:
  face:
    plugin: insightface
    params: {}
  speaker:
    plugin: speechbrain_ecapa
    params: {}
  vad:
    plugin: silero
    params: {}
  stt:
    plugin: faster_whisper
    params: {}
  sensitivity:
    plugin: zero_shot
    params: {}
  datetime_parser:
    plugin: dateparser
    params: {}
hardware:
  ohbot:
    port: auto
    turn_left: 2.0
    turn_front: 5.0
    turn_right: 8.0
    nod_level: 6.0
    nod_up: 8.0
    nod_down: 4.0
    move_seconds: 0.8
  speaker:
    backend: ohbot
    voice: null
    output_device: null
  camera:
    name: C615
    index: 0
    width: 640
    height: 480
    source: device
    image_dir: null
    warmup_frames: 5
  microphone:
    device: null
    sample_rate: 16000
    chunk_ms: 32
    source: device
    wav_path: null
    wav_realtime: true
  watch:
    name_prefix: Bangle.js
    address: null
    reconnect_attempts: 3
    scan_timeout_seconds: 10.0
  executor_workers: 4
storage:
  event_log_retention_days: 0
  models_dir: models
logging:
  level: INFO
live_view:
  enabled: false
