[project]
name = "privacy-aware-social-robot"
version = "0.1.0"
description = "Privacy-aware personal social robot (Ohbot + Bangle.js) , research platform"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aroosa Batool" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "dateparser>=1.2",
    "filelock>=3.16",
    "numpy>=2.0",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.15",
    # Dashboard
    "pandas>=2.2",
    "streamlit>=1.45",
    # Robot head, watch, microphone
    "ohbot>=4.0.18",
    "pyserial>=3.5",
    "bleak>=2.0",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    # Camera and face model (insightface 2.x does not declare opencv; never add -headless beside it)
    "insightface>=2.0",
    "onnxruntime>=1.20",
    "opencv-python>=4.10",
    "pyobjc-core>=10.0; sys_platform == 'darwin'",  # finds the head camera by name
    # Voice: speaker model, voice-activity detection, speech-to-text
    "torch>=2.5",
    "torchaudio>=2.5",
    "speechbrain>=1.0",
    "silero-vad>=5.1",
    "faster-whisper>=1.1",
    # Reminder text: sensitivity model
    "transformers>=5.0",
]

[project.optional-dependencies]
# A lighter alternative speaker model; separate because it pulls librosa and a webrtcvad
# source build.
resemblyzer = ["resemblyzer>=0.1.4"]

[project.scripts]
pasr = "pasr.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "types-dateparser",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pasr"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Privacy guard: the robot never writes raw camera frames or audio to disk.
"cv2.imwrite".msg = "Raw frames must never be persisted (see docs/PRIVACY.md)."
"cv2.VideoWriter".msg = "Raw video must never be persisted (see docs/PRIVACY.md)."
"soundfile.write".msg = "Raw audio must never be persisted (see docs/PRIVACY.md)."
"scipy.io.wavfile.write".msg = "Raw audio must never be persisted (see docs/PRIVACY.md)."
"numpy.save".msg = "Store embeddings through pasr.storage, never as loose files."
"numpy.savez".msg = "Store embeddings through pasr.storage, never as loose files."

[tool.ruff.lint.per-file-ignores]
# Tests may build fixtures freely.
"tests/**" = ["TID251"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = "pasr.dashboard.*"
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = [
    "ohbot.*",
    "bleak.*",
    "serial.*",
    "cv2.*",
    "objc.*",
    "sounddevice.*",
    "soundfile.*",
    "insightface.*",
    "onnxruntime.*",
    "torch.*",
    "torchaudio.*",
    "speechbrain.*",
    "transformers.*",
    "silero_vad.*",
    "resemblyzer.*",
    "faster_whisper.*",
    "pandas.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not hardware and not models'"
filterwarnings = [
    # raised inside Streamlit's chart code, not ours
    "ignore:The inplace keyword in DataFrame.reset_index is deprecated",
]
markers = [
    "hardware: needs the real robot hardware (run with PASR_HW_TESTS=1)",
    "models: needs downloaded ML models",
]

# CPU-only torch on Linux (CI): the default PyPI wheels there pull in the CUDA libraries.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
